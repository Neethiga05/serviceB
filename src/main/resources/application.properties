spring.application.name=serviceBdemo
server.port=8084
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - [traceId=%X{traceId:-none}] [spanId=%X{spanId:-none}] %msg%n

# LLM / AI reviewer configuration
llm.provider=openai
llm.base-url=https://api.openai.com/v1
llm.model=gpt-4o
llm.api-key=${LLM_API_KEY:}
llm.timeout-ms=15000

# GitHub integration (optional - used to fetch diffs and verify webhooks)
github.token=${GITHUB_TOKEN:}
github.webhook.secret=${GITHUB_WEBHOOK_SECRET:}

# PR reviewer limits
prreview.rate-limit.per-minute=60
prreview.max-diff-bytes=200000
